[package]
name = "jarvis"
version = "0.2.1"
description = "Jarvis desktop assistant"
authors = ["spiderpaj1209-web"]
edition = "2021"

[lib]
name = "jarvis_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = "2"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
serde_json = "1"
urlencoding = "2"
