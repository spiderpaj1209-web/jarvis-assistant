<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Jarvis</title><style>*{box-sizing:border-box;}body{margin:0;font-family:-apple-system,Segoe UI,Roboto,sans-serif;background:#0e0f13;color:#eee;height:100vh;display:flex;flex-direction:column;}header{padding:14px 20px;background:#141620;border-bottom:1px solid #23263a;display:flex;align-items:center;gap:10px;}header h1{font-size:18px;margin:0;color:#6ee7ff;}#chat{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:14px;}.msg{max-width:75%;padding:12px 16px;border-radius:14px;line-height:1.5;white-space:pre-wrap;}.user{align-self:flex-end;background:#2b5fff;color:white;}.assistant{align-self:flex-start;background:#1c1f2b;border:1px solid #2a2e42;}.artifact-btn{margin-top:10px;display:inline-block;padding:8px 14px;background:#6ee7ff;color:#0e0f13;border:none;border-radius:8px;cursor:pointer;font-weight:600;}#inputBar{display:flex;gap:8px;padding:16px 20px;background:#141620;border-top:1px solid #23263a;}#textInput{flex:1;padding:12px 14px;border-radius:10px;border:1px solid #2a2e42;background:#0e0f13;color:white;font-size:15px;}button.action{padding:12px 16px;border:none;border-radius:10px;background:#2b5fff;color:white;cursor:pointer;font-size:15px;}button.mic.active{background:#ff4757;}#modalOverlay{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;z-index:999;}#modalBox{background:#141620;width:90%;height:85%;border-radius:14px;padding:16px;display:flex;flex-direction:column;}#modalBox iframe{flex:1;border:none;border-radius:8px;background:white;}#modalClose{align-self:flex-end;background:#ff4757;color:white;border:none;border-radius:8px;padding:6px 12px;margin-bottom:8px;cursor:pointer;}.slide{padding:60px;text-align:center;}.slide h2{color:#6ee7ff;font-size:32px;}.slide ul{text-align:left;display:inline-block;font-size:22px;line-height:1.8;}#slideNav{display:flex;justify-content:center;gap:12px;padding:10px;}#slideNav button{padding:8px 14px;border-radius:8px;border:none;background:#2b5fff;color:white;cursor:pointer;}img.gen-image{max-width:100%;border-radius:10px;margin-top:8px;}.thinking{opacity:.6;font-style:italic;}</style></head><body><header><h1>Jarvis</h1><span style="font-size:12px;color:#888;">Assistant personnel - memoire persistante</span></header><div id="chat"></div><div id="inputBar"><button class="action mic" id="micBtn" title="Parler">Mic</button><input id="textInput" placeholder="Ecris ou parle a Jarvis..." /><button class="action" id="sendBtn">Envoyer</button></div><div id="modalOverlay"><div id="modalBox"><button id="modalClose">Fermer</button><div id="modalContent" style="flex:1;overflow:auto;"></div></div></div><script>const chatEl=document.getElementById('chat');const textInput=document.getElementById('textInput');const sendBtn=document.getElementById('sendBtn');const micBtn=document.getElementById('micBtn');const modalOverlay=document.getElementById('modalOverlay');const modalContent=document.getElementById('modalContent');document.getElementById('modalClose').onclick=()=>modalOverlay.style.display='none';let sessionId=localStorage.getItem('jarvis_session');if(!sessionId){sessionId='sess-'+Math.random().toString(36).slice(2);localStorage.setItem('jarvis_session',sessionId);}function addMessage(role,text){const div=document.createElement('div');div.className='msg '+role;div.textContent=text;chatEl.appendChild(div);chatEl.scrollTop=chatEl.scrollHeight;return div;}function addArtifactButton(container,artifact){if(!artifact)return;if(artifact.type==='code'){const btn=document.createElement('button');btn.className='artifact-btn';btn.textContent='Tester';btn.onclick=()=>{modalContent.innerHTML='<iframe sandbox="allow-scripts allow-same-origin" srcdoc="'+artifact.content.replace(/"/g,'&quot;')+'"></iframe>';modalOverlay.style.display='flex';};container.appendChild(btn);}else if(artifact.type==='slides'){const btn=document.createElement('button');btn.className='artifact-btn';btn.textContent='Afficher';btn.onclick=()=>renderSlides(artifact.content.slides||[]);container.appendChild(btn);const dlBtn=document.createElement('button');dlBtn.className='artifact-btn';dlBtn.style.marginLeft='8px';dlBtn.textContent='Export PowerPoint';dlBtn.onclick=async()=>{const res=await fetch('/api/pptx',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(artifact.content)});const data=await res.json();window.open(data.download_url,'_blank');};container.appendChild(dlBtn);}else if(artifact.type==='image'){const img=document.createElement('img');img.className='gen-image';img.src='/api/image?prompt='+encodeURIComponent(artifact.content);container.appendChild(img);}}function renderSlides(slides){let idx=0;function show(){const s=slides[idx];modalContent.innerHTML='<div class="slide"><h2>'+s.title+'</h2><ul>'+(s.bullets||[]).map(b=>'<li>'+b+'</li>').join('')+'</ul></div>'+'<div id="slideNav"><button id="prevS">Precedent</button><span style="align-self:center;color:#888;"> '+(idx+1)+' / '+slides.length+' </span><button id="nextS">Suivant</button></div>';document.getElementById('prevS').onclick=()=>{if(idx>0){idx--;show();}};document.getElementById('nextS').onclick=()=>{if(idx<slides.length-1){idx++;show();}};}show();modalOverlay.style.display='flex';}async function sendMessage(){const text=textInput.value.trim();if(!text)return;addMessage('user',text);textInput.value='';const thinkingDiv=addMessage('assistant','Jarvis reflechit...');thinkingDiv.classList.add('thinking');try{const res=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session_id:sessionId,message:text})});const data=await res.json();thinkingDiv.classList.remove('thinking');thinkingDiv.textContent=data.reply||data.error||'Erreur';if(data.artifact)addArtifactButton(thinkingDiv,data.artifact);if('speechSynthesis' in window && data.reply){const utter=new SpeechSynthesisUtterance(data.reply.slice(0,500));utter.lang='fr-FR';speechSynthesis.speak(utter);}}catch(e){thinkingDiv.classList.remove('thinking');thinkingDiv.textContent='Erreur de connexion au serveur.';}}sendBtn.onclick=sendMessage;textInput.addEventListener('keydown',(e)=>{if(e.key==='Enter')sendMessage();});let recognition;if('webkitSpeechRecognition' in window||'SpeechRecognition' in window){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;recognition=new SR();recognition.lang='fr-FR';recognition.continuous=false;recognition.interimResults=false;recognition.onresult=(e)=>{textInput.value=e.results[0][0].transcript;sendMessage();};recognition.onend=()=>micBtn.classList.remove('active');micBtn.onclick=()=>{micBtn.classList.add('active');recognition.start();};}else{micBtn.disabled=true;micBtn.title='Micro non supporte par ce navigateur';}addMessage('assistant',"Salut, je suis Jarvis. Parle-moi ou ecris-moi - je me souviens de tout entre nos discussions.");</script></body></html>
